<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07040d" />
    <title>爱意粒子</title>
    <script type="module" crossorigin src="/lhz-happy/assets/index-DVZbl140.js"></script>
    <link rel="stylesheet" crossorigin href="/lhz-happy/assets/index-YzUcZuSn.css">
  </head>
  <body>
    <canvas id="scene" aria-label="由粒子组成的立体爱心，移动鼠标或滑动手掌可以推动粒子"></canvas>

    <div class="status" id="status" role="status" aria-live="polite">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">移动鼠标即可推动粒子</span>
    </div>

    <p class="caption" id="voice-caption" aria-live="polite" hidden></p>

    <section class="gallery" id="gallery" aria-label="照片轮播" hidden>
      <div class="photo-frame">
        <img class="photo" id="photo-a" alt="" />
        <img class="photo" id="photo-b" alt="" />
        <button type="button" class="add-photo" id="gallery-empty" hidden>＋ 添加照片</button>
      </div>
      <div class="gallery-controls">
        <button type="button" class="mini" id="g-prev" aria-label="上一张">‹</button>
        <button type="button" class="mini" id="g-pause" aria-pressed="false">暂停</button>
        <button type="button" class="mini" id="g-next" aria-label="下一张">›</button>
        <span class="counter" id="g-counter"></span>
        <button type="button" class="mini" id="g-replay">重新播放</button>
        <button type="button" class="mini" id="g-add">添加照片</button>
      </div>
    </section>
    <input type="file" id="file-input" accept="image/*" multiple hidden />

    <figure class="preview" id="preview" hidden>
      <video id="video" playsinline muted></video>
      <canvas id="preview-overlay"></canvas>
      <button type="button" class="preview-toggle" id="btn-preview" aria-label="收起摄像头预览" title="收起预览">–</button>
    </figure>
    <button type="button" class="preview-dot" id="preview-dot" aria-label="展开摄像头预览" title="展开摄像头预览" hidden>
      <span></span>
    </button>

    <div class="effects" id="effects" role="radiogroup" aria-label="爱意效果"></div>

    <nav class="controls" aria-label="控制">
      <button type="button" id="btn-camera" class="btn primary">开启摄像头</button>
      <button type="button" id="btn-auto" class="btn" aria-pressed="false">自动展示</button>
      <button type="button" id="btn-voice" class="btn" aria-pressed="false">开启语音</button>
      <button type="button" id="btn-bless" class="btn bless">开启祝福</button>
      <label class="select-wrap" id="camera-select-wrap" hidden>
        <span class="sr-only">选择摄像头</span>
        <select id="camera-select"></select>
      </label>
    </nav>

    <pre class="debug" id="debug" hidden></pre>

  </body>
</html>
